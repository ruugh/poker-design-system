name: Release

# Changesets flow: a push to main with pending changesets opens/updates a "Version
# Packages" PR; merging that PR builds the library and publishes to GitHub Packages.
# Uses the built-in GITHUB_TOKEN — no external registry secret required.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # create the version PR / tags
  pull-requests: write
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ruugh'

      - run: npm ci

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # `npm run build` (tokens + tsup) runs via prepack when publishing
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
