name: Chromatic

# Visual regression: every PR gets a diff of all five components in both themes.
# Requires the CHROMATIC_PROJECT_TOKEN secret (Settings → Secrets → Actions),
# obtained by linking this repo at https://www.chromatic.com.
# Until that secret exists the publish step is skipped, so the job stays green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full history to compare against the baseline

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true # TurboSnap: only re-snapshot stories touched by the diff
          exitZeroOnChanges: true # visual changes are reviewed in Chromatic, not a hard CI fail
